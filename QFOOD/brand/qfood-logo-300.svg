<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#c7fd3e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c7fd3e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4fe6a"/>
      <stop offset="100%" stop-color="#c7fd3e"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="300" height="300" fill="#0a0c08"/>
  <rect width="300" height="300" fill="url(#glow)"/>

  <!-- badge -->
  <rect x="84" y="46" width="132" height="132" rx="32" fill="url(#badge)"/>

  <!-- QR-style glyph, dark on lime -->
  <g transform="translate(108,70)" fill="#0a0c08">
    <!-- finder: top-left -->
    <rect x="0" y="0" width="26" height="26" rx="7"/>
    <rect x="9" y="9" width="8" height="8" rx="2" fill="#c7fd3e"/>
    <!-- finder: top-right -->
    <rect x="58" y="0" width="26" height="26" rx="7"/>
    <rect x="67" y="9" width="8" height="8" rx="2" fill="#c7fd3e"/>
    <!-- finder: bottom-left -->
    <rect x="0" y="58" width="26" height="26" rx="7"/>
    <rect x="9" y="67" width="8" height="8" rx="2" fill="#c7fd3e"/>
    <!-- center dot -->
    <circle cx="42" cy="42" r="6.5"/>
    <!-- data cluster bottom-right -->
    <rect x="58" y="58" width="10" height="10" rx="2.5"/>
    <rect x="74" y="58" width="10" height="10" rx="2.5"/>
    <rect x="58" y="74" width="10" height="10" rx="2.5"/>
    <rect x="74" y="74" width="10" height="10" rx="2.5"/>
    <!-- small accents -->
    <rect x="40" y="2" width="8" height="8" rx="2"/>
    <rect x="2" y="40" width="8" height="8" rx="2"/>
  </g>

  <!-- wordmark -->
  <text x="150" y="240" text-anchor="middle"
        font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif"
        font-size="50" font-weight="800" letter-spacing="-1">
    <tspan fill="#ffffff">QFoo</tspan><tspan fill="#c7fd3e">D</tspan>
  </text>
</svg>
